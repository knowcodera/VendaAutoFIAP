apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: carro-vendido-api-backend-hpa
  namespace: carro-vendido # Alterado para o namespace correto
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: carro-vendido-api # Alterado para o nome correto do Deployment
  minReplicas: 1
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 80
  # - type: Resource # Exemplo para escalar por memória também (descomente se necessário)
  #   resource:
  #     name: memory
  #     target:
  #       type: Utilization 
  #       averageUtilization: 80 